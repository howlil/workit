<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senior Frontend Engineer - Acme Corp Careers</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #333;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #111;
    }
    .company {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: #222;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2F7D44;
    }
    .controlled-value-display {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
    .btn-submit {
      padding: 12px 24px;
      background: #2F7D44;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "Senior Frontend Engineer",
    "hiringOrganization": {
      "@type": "Organization",
      "name": "Acme Corp"
    },
    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Jakarta",
        "addressCountry": "Indonesia"
      }
    },
    "employmentType": "FULL_TIME",
    "description": "We are seeking a senior frontend engineer with React and TypeScript skills."
  }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="job-title">Senior Frontend Engineer</h1>
      <div class="company" id="company-name">Acme Corp • Jakarta, Indonesia</div>
    </header>

    <form id="job-application-form">
      <!-- 1. Native text input with autocomplete -->
      <div class="form-group">
        <label for="applicant-name">Full Name *</label>
        <input
          id="applicant-name"
          name="fullName"
          type="text"
          autocomplete="name"
          placeholder="Jane Doe"
          required
        />
      </div>

      <!-- 2. Email input -->
      <div class="form-group">
        <label for="applicant-email">Email Address *</label>
        <input
          id="applicant-email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="jane@example.com"
          required
        />
      </div>

      <!-- 3. Phone input -->
      <div class="form-group">
        <label for="applicant-phone">Phone Number *</label>
        <input
          id="applicant-phone"
          name="phone"
          type="tel"
          autocomplete="tel"
          placeholder="+1 555-0199"
          required
        />
      </div>

      <!-- 4. Location input -->
      <div class="form-group">
        <label for="applicant-location">Location / City *</label>
        <input
          id="applicant-location"
          name="location"
          type="text"
          placeholder="City, Country"
          required
        />
      </div>

      <!-- 5. Controlled input simulating React / modern framework two-way sync -->
      <div class="form-group">
        <label for="applicant-linkedin">LinkedIn Profile URL</label>
        <input
          id="applicant-linkedin"
          name="linkedin_url"
          type="url"
          placeholder="https://linkedin.com/in/..."
        />
        <div id="linkedin-synced-state" class="controlled-value-display">State: (empty)</div>
      </div>

      <!-- 6. Portfolio URL -->
      <div class="form-group">
        <label for="applicant-portfolio">Portfolio / Website</label>
        <input
          id="applicant-portfolio"
          name="portfolio"
          type="url"
          placeholder="https://yourportfolio.com"
        />
      </div>

      <!-- 7. Textarea -->
      <div class="form-group">
        <label for="applicant-summary">Cover Note / Summary</label>
        <textarea
          id="applicant-summary"
          name="summary"
          rows="4"
          placeholder="Tell us about yourself..."
        ></textarea>
      </div>

      <!-- 7b. Custom Employer Question Textarea -->
      <div class="form-group" id="group-custom-question">
        <label for="applicant-motivation">Why do you want to work at our company? *</label>
        <textarea
          id="applicant-motivation"
          name="motivation"
          rows="4"
          placeholder="Tell us what excites you about this role..."
        ></textarea>
      </div>

      <!-- 8. Select dropdown -->
      <div class="form-group">
        <label for="work-authorization">Work Authorization</label>
        <select id="work-authorization" name="work_auth">
          <option value="">Select an option</option>
          <option value="authorized">Authorized to work</option>
          <option value="sponsorship">Require sponsorship</option>
        </select>
      </div>

      <!-- 9. Checkbox -->
      <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="terms-agree" name="terms" />
        <label for="terms-agree" style="margin-bottom: 0; font-weight: normal;">
          I certify that all information submitted is true
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submit-application-btn">Submit Application</button>
    </form>
  </div>

  <script>
    // Simulate React controlled input binding
    const linkedinInput = document.getElementById("applicant-linkedin");
    const syncDisplay = document.getElementById("linkedin-synced-state");

    let internalState = "";
    linkedinInput.addEventListener("input", (e) => {
      internalState = e.target.value;
      syncDisplay.textContent = "State: " + internalState;
    });
    linkedinInput.addEventListener("change", (e) => {
      internalState = e.target.value;
      syncDisplay.textContent = "State: " + internalState;
    });
  </script>
</body>
</html>
